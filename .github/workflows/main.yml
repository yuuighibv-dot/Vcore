name: Build VCore JAR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build VCore
        run: |
          if [ -f vcore_rebuild/build.gradle ]; then
            cd vcore_rebuild
          fi
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VCore-JAR
          path: |
            vcore_rebuild/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
